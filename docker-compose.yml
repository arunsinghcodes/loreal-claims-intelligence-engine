services:
  postgres:
    image: postgres:17-alpine
    container_name: claims-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: claims_intelligence
      POSTGRES_USER: claims_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_app -d claims_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
